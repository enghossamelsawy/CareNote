# Runs the same checks as locally: formatting, Android Lint, unit tests and the debug build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build
        run: ./gradlew assembleDebug

      # Device tests need a phone, but they must at least compile.
      - name: Compile device tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
