# Runs the same checks as locally: formatting, Android Lint, unit tests, screenshots and the debug builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew ktlintCheck

      # Libraries have lintDebug; the app has one lint task per flavor.
      - name: Lint
        run: ./gradlew lintDebug lintMockDebug lintProdDebug

      # Runs JVM module tests (test) and Android unit tests for every variant, both flavors included.
      - name: Unit tests
        run: ./gradlew test

      # Both flavors: mock is what demos run, prod is what would ship.
      - name: Build
        run: ./gradlew assembleMockDebug assembleProdDebug

      # Compares every screen with its recorded image in src/test/screenshots, light and dark.
      - name: Verify screenshots
        run: ./gradlew verifyRoborazziDebug

      # Device tests need a phone, but they must at least compile.
      - name: Compile device tests
        run: ./gradlew assembleMockDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          # Reports, plus Roborazzi's comparison images (old, new and the difference) for failed screenshots.
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7
